<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Mukta:wght@400;600&display=swap" rel="stylesheet">
<style>

box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0e2b;--bg2:#1a2158;--card:rgba(255,255,255,.06);--line:rgba(240,184,58,.22);--ink:#f4ead2;--mut:#a3a9d6;--gold:#f0b83a;--gold2:#ffd77a;--kum:#ff6b5e;--fut:#2c3470;--dot:rgba(255,255,255,.08)}}
:root[data-theme="dark"]{--bg:#0a0e2b;--bg2:#1a2158;--card:rgba(255,255,255,.06);--line:rgba(240,184,58,.22);--ink:#f4ead2;--mut:#a3a9d6;--gold:#f0b83a;--gold2:#ffd77a;--kum:#ff6b5e;--fut:#2c3470;--dot:rgba(255,255,255,.08)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:16px/1.5 Mukta,system-ui,sans-serif;-webkit-text-size-adjust:100%;min-height:100vh;
background:radial-gradient(900px 520px at 50% -8%,var(--bg2),transparent 70%),radial-gradient(var(--dot) 1px,transparent 1.5px) 0 0/26px 26px,var(--bg)}
main{max-width:600px;margin:0 auto;padding:22px 16px 56px}
h1,h2,.f{font-family:Marcellus,Georgia,serif;font-weight:400}
h1{margin:0;text-align:center;font-size:34px;letter-spacing:.03em;background:linear-gradient(180deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.te{text-align:center;color:var(--mut);margin:0;font-size:15px}
.sub{text-align:center;color:var(--mut);font-size:13px;margin:2px 0 4px}
.brand{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;margin:2px 0 4px}
.brand h1,.brand .te{text-align:center}
.brand h1{font-size:31px}
.brand .te{font-size:14px}
.brand-tag{color:var(--mut);font-size:12px;margin:2px 0 0;letter-spacing:.03em;text-align:center}
.ayyappa-avatar{display:block;width:78px;height:78px;flex:none;object-fit:cover;border:1.5px solid var(--gold);border-radius:50%;background:#090909;filter:drop-shadow(0 4px 7px rgba(50,25,0,.15))}
svg.mala{display:block;width:100%;max-width:350px;margin:0 auto}
.thread{fill:none;stroke:var(--gold);stroke-opacity:.35;stroke-width:1.5}
.bead{stroke-width:1.5;cursor:pointer;transition:transform .2s}
.bead.done{fill:var(--gold);stroke:var(--gold2);filter:url(#g)}
.bead.part{fill:var(--gold);fill-opacity:.4;stroke:var(--gold)}
.bead.fut{fill:var(--fut);stroke:none}
.bead.now{fill:none;stroke:var(--gold2);stroke-width:3;animation:p 2s ease-in-out infinite}
.bead.miss{fill:none;stroke:var(--kum);stroke-opacity:.8}
.bead.sel{stroke:var(--ink);stroke-width:3}
@keyframes p{50%{stroke-opacity:.3}}
@media (prefers-reduced-motion:reduce){.bead.now{animation:none}}
.om{font:22px Marcellus,serif;fill:var(--gold);text-anchor:middle}
.big{font:400 38px Marcellus,Georgia,serif;fill:var(--ink);text-anchor:middle}
.small{font:14px Mukta,sans-serif;fill:var(--mut);text-anchor:middle}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0 6px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 6px;text-align:center;backdrop-filter:blur(6px)}
.stat b{display:block;font:400 28px Marcellus,Georgia,serif;color:var(--gold)}
.stat span{font-size:12px;color:var(--mut)}
.ms{text-align:center;font-size:13px;color:var(--mut);margin:0 0 18px}

.hd{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
h2{font-size:24px;margin:0}
.dtt{color:var(--mut);font-size:14px}
.pb{height:8px;border-radius:8px;background:var(--fut);margin:12px 0 4px;overflow:hidden}

.pc{font-size:13px;color:var(--mut)}
.v{display:flex;align-items:center;gap:14px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.v input{position:absolute;opacity:0;pointer-events:none}
.ck{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;color:transparent;font-size:15px;transition:.15s}
.v.on .ck{background:var(--gold);color:var(--onGold)}
.v label{flex:1;cursor:pointer}
.v.on label{color:var(--mut);text-decoration:line-through}
.v input:focus-visible+.ck{outline:2px solid var(--ink);outline-offset:2px}
.x{background:none;border:0;color:var(--mut);font-size:20px;cursor:pointer;padding:4px 8px}
.row{display:flex;gap:8px;margin-top:12px}
.row.w{flex-wrap:wrap}
textarea,input[type=text],input[type=date]{width:100%;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:11px 13px;font:inherit}
textarea{min-height:120px;resize:vertical;margin-top:14px}
.b{background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--onGold);border:0;border-radius:12px;padding:10px 16px;font:600 15px Mukta,sans-serif;cursor:pointer;white-space:nowrap}
.b.o{background:none;border:1.5px solid var(--gold);color:var(--ink)}
.sv{font-size:12px;color:var(--mut);text-align:right;min-height:18px}
.wk,.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wk{margin:10px 0 6px;text-align:center;font-size:12px;color:var(--mut)}
.c{aspect-ratio:1;min-height:42px;border-radius:12px;border:1.5px solid var(--line);background:none;color:var(--ink);font:inherit;font-size:16px;position:relative;cursor:pointer;padding:0}
.c i{position:absolute;top:2px;left:5px;font-style:normal;font-size:9px;color:var(--mut)}
.c.done{background:linear-gradient(180deg,var(--gold2),var(--gold));border-color:var(--gold);color:var(--onGold)}
.c.done i{color:var(--onGold)}
.c.part{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 25%,transparent)}
.c.miss{border-color:var(--kum);color:var(--kum)}
.c.now{border:2.5px solid var(--gold2)}
.c.fut{color:var(--mut)}
.c.sel{outline:2.5px solid var(--ink);outline-offset:1px}
.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:10px}
.lg span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;background:var(--c);border:1px solid var(--c)}
.j{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 0;color:var(--ink);font:inherit;cursor:pointer}
.j small{display:block;color:var(--mut)}
details{color:var(--mut)}summary{cursor:pointer;font-size:15px}
details>div{margin-top:12px}
.msg{font-size:13px;color:var(--gold);min-height:18px;margin-top:8px}
.foot{text-align:center;font-size:20px;margin-top:26px;color:var(--gold)}
.topbar{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}
.music{display:flex;justify-content:center}
.pp{width:48px;height:48px;border-radius:50%;border:0;background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--onGold);font-size:19px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.16)}
.theme-control{display:flex;align-items:center;justify-content:flex-end;gap:5px;color:var(--gold);font-size:16px;cursor:pointer}
.theme-control input{position:absolute;width:1px;height:1px;opacity:0}
.switch-track{display:inline-flex;align-items:center;width:42px;height:24px;padding:2px;border:1px solid var(--line);border-radius:99px;background:var(--fut);transition:background .2s}
.switch-thumb{width:18px;height:18px;border-radius:50%;background:var(--bg2);box-shadow:0 1px 4px rgba(0,0,0,.25);transition:transform .2s}
.theme-control input:checked+.switch-track .switch-thumb{transform:translateX(18px)}
.theme-control input:focus-visible+.switch-track{outline:2px solid var(--gold2);outline-offset:2px}
.devocopy{color:var(--mut);font-size:14px;margin:2px 0 8px}
.vgroup{font-size:16px;font-weight:600;color:var(--gold);margin:14px 0 2px}
[hidden]{display:none!important}
button:disabled{opacity:.45;cursor:not-allowed}
.lk textarea{opacity:.85}
.lkb{margin-top:10px;width:100%}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
</style>

</div>

<div><h1>Mala Deeksha</h1><p class="te">🙏 స్వామియే శరణం అయ్యప్ప 🪷</p><p class="brand-tag">41 days of prayer, discipline &amp; reflection</p></div>

<section>
<h2>Calendar</h2>
<div class="wk"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div>
<div class="cal" id="cal"></div>
<div class="lg"><span style="--c:var(--gold)">Done</span><span style="--c:var(--gold2)">Today</span><span style="--c:var(--kum)">Missed</span><span style="--c:var(--fut)">Ahead</span></div>
</section>

<h2>Daily reflections</h2>
<div id="jn"></div>
</section>

<p class="foot f">Swamiye Saranam Ayyappa</p>
</main>
<script>
const DEF=[["am","Morning bath & pooja"],["pm","Evening bath & pooja"],["ch","Sharanam chanting (108×)"],["fd","Sattvic food only"],["bk","Black / blue dress, no footwear"],["tr","Truthful words, no anger"],["fl","Sleep on the floor"]];
const MS=864e5,$=s=>document.querySelector(s);
let S={start:"2026-11-11",vows:DEF.map(([id,t])=>({id,t})),days:{},theme:""};
try{const r=localStorage.getItem("mala41");if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem("mala41",JSON.stringify(S))}catch(e){}push()};
const pu=s=>{const[a,b,c]=s.split("-").map(Number);return Date.UTC(a,b-1,c)};
const nowU=()=>{const n=new Date();return Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())};
const dateOf=d=>new Date(pu(S.start)+(d-1)*MS);
const fmt=(d,o)=>d.toLocaleDateString("en-GB",Object.assign({timeZone:"UTC"},o));
const today=()=>Math.floor((nowU()-pu(S.start))/MS)+1;
const dd=d=>S.days[d]||(S.days[d]={c:[],n:""});
const cnt=d=>{const x=S.days[d];return x?x.c.filter(i=>S.vows.some(v=>v.id===i)).length:0};
const st=d=>{const t=today(),c=cnt(d);if(c&&c>=S.vows.length)return"done";if(c)return"part";if(d>t)return"fut";if(d===t)return"now";return"miss"};
const setTheme=()=>{if(S.theme)document.documentElement.setAttribute("data-theme",S.theme);else document.documentElement.removeAttribute("data-theme");const sw=$("#th");if(sw)sw.checked=S.theme?S.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches};
let sel=Math.min(Math.max(today(),1),41);

function mala(){
  const t=today();let b='<circle class="thread" cx="150" cy="150" r="118"/>';
  for(let i=0;i<41;i++){const d=i+1,a=i/41*2*Math.PI-Math.PI/2;
    b+=`<circle class="bead ${st(d)}${d===sel?" sel":""}" data-d="${d}" cx="${(150+118*Math.cos(a)).toFixed(1)}" cy="${(150+118*Math.sin(a)).toFixed(1)}" r="7.8"/>`}
  let big,sub;
  if(t<1){big="Soon";sub=`starts in ${1-t} day${1-t>1?"s":""}`}
  else if(t>41){big="Done";sub="Swamiye Saranam"}
  else{big="Day "+t;sub=`of 41 · ${41-t} to go`}
  $("#mg").innerHTML=b+`<text class="om" x="150" y="118">ॐ</text><text class="big" x="150" y="160">${big}</text><text class="small" x="150" y="184">${sub}</text>`;
  let done=0,s=0;for(let d=1;d<=41;d++)if(st(d)==="done")done++;
  for(let d=Math.min(t,41);d>=1;d--){if(st(d)==="done")s++;else if(d===t)continue;else break}
  $("#s1").textContent=done;$("#s2").textContent=s;$("#s3").textContent=Math.max(0,Math.min(41,41-Math.max(t,0)));
  const m=[7,14,21,28,35,41].find(x=>x>=t),until=m-t;
  $("#ms").textContent=t<1||t>41?"":(m===t?`Milestone day today: Day ${m} 🙏`:`Next milestone: Day ${m}, in ${until} ${until===1?"day":"days"}`);
  $("#range").textContent=fmt(dateOf(1),{day:"numeric",month:"short"})+" to "+fmt(dateOf(41),{weekday:"short",day:"numeric",month:"short",year:"numeric"});
}
function cal(){
  const off=(new Date(pu(S.start)).getUTCDay()+6)%7;let h="<span></span>".repeat(off);
  for(let d=1;d<=41;d++){const dt=dateOf(d),n=dt.getUTCDate();
    h+=`<button class="c ${st(d)}${d===sel?" sel":""}" data-d="${d}" aria-label="Day ${d}">${n===1||d===1?`<i>${fmt(dt,{month:"short"})}</i>`:""}${n}</button>`}
  $("#cal").innerHTML=h;
}
function day(){
  $("#dn").textContent="Day "+sel;$("#dd").textContent=fmt(dateOf(sel),{weekday:"long",day:"numeric",month:"long"});
  const x=dd(sel),n=S.vows.length,c=cnt(sel),box=$("#vows");box.innerHTML="";
  $("#bar").style.width=(n?c/n*100:0)+"%";$("#pc").textContent=`${c} of ${n} done`;
  const prayerIds=new Set(["am","ch","pm"]),disciplineIds=new Set(["fd","bk","tr","fl"]);
  function addVow(v){
    const on=x.c.includes(v.id),r=document.createElement("div");r.className="v"+(on?" on":"");
    const cb=document.createElement("input");cb.type="checkbox";cb.id="v_"+v.id;cb.checked=on;
    cb.onchange=()=>{const y=dd(sel);y.c=cb.checked?[...y.c,v.id]:y.c.filter(i=>i!==v.id);y.t=Date.now();save();day();mala();cal()};
    const ck=document.createElement("span");ck.className="ck";ck.textContent="✓";
    const lb=document.createElement("label");lb.htmlFor=cb.id;lb.textContent=v.t;
    const xb=document.createElement("button");xb.className="x";xb.textContent="×";xb.setAttribute("aria-label","Remove "+v.t);
    xb.onclick=e=>{e.stopPropagation();S.vows=S.vows.filter(q=>q.id!==v.id);S.vt=Date.now();save();all()};
    r.onclick=e=>{if(e.target===r)cb.click()};
    r.append(cb,ck,lb,xb);box.append(r)}
  const groups=[
    {title:"Prayer & pooja",items:S.vows.filter(v=>prayerIds.has(v.id))},
    {title:"Deeksha observances",items:S.vows.filter(v=>disciplineIds.has(v.id))},
    {title:"Personal observances",items:S.vows.filter(v=>!prayerIds.has(v.id)&&!disciplineIds.has(v.id))}
  ];
  groups.forEach(g=>{if(!g.items.length)return;const h=document.createElement("h3");h.className="vgroup";h.textContent=g.title;box.append(h);g.items.forEach(addVow)});
  $("#note").value=x.n||"";$("#sv").textContent="";
}
function jn(){
  const box=$("#jn");box.innerHTML="";let any=false;
  for(let d=41;d>=1;d--){const n=S.days[d]&&S.days[d].n;if(!n||!n.trim())continue;any=true;
    const b=document.createElement("button");b.className="j";
    const s=document.createElement("small");s.textContent=`Day ${d} · ${fmt(dateOf(d),{day:"numeric",month:"short"})}`;
    b.append(s,n.length>90?n.slice(0,90)+"…":n);
    b.onclick=()=>{sel=d;all();scrollTo({top:0,behavior:"smooth"})};box.append(b)}
  if(!any)box.textContent="Reflections you write each day will collect here.";
}
function all(){mala();cal();day();jn();applyLock()}
const pick=e=>{const d=e.target.dataset&&e.target.dataset.d;if(d){sel=+d;all()}};
$("#mala").onclick=pick;$("#cal").onclick=pick;
let tm;$("#note").oninput=e=>{const y=dd(sel);y.n=e.target.value;y.t=Date.now();save();$("#sv").textContent="Saving…";clearTimeout(tm);tm=setTimeout(()=>$("#sv").textContent="Saved ✓",500)};
$("#note").onchange=()=>{jn()};
$("#all").onclick=()=>{const y=dd(sel);y.c=S.vows.map(v=>v.id);y.t=Date.now();save();all()};
$("#clr").onclick=()=>{const y=dd(sel);y.c=[];y.t=Date.now();save();all()};
$("#av").onclick=()=>{const i=$("#nv"),t=i.value.trim();if(!t)return;S.vows.push({id:"u"+Date.now(),t});S.vt=Date.now();i.value="";save();all()};
$("#nv").onkeydown=e=>{if(e.key==="Enter")$("#av").click()};
$("#th").onchange=()=>{S.theme=$("#th").checked?"dark":"light";setTheme();save()};
const SR=["swamiye-saranam.mp3.aac","swamiye-saranam.aac","swamiye-saranam.mp3","swamiye-saranam.m4a"];let si=0;const au=new Audio(SR[0]);au.autoplay=true;au.loop=true;au.preload="auto";au.volume=.8;let bad=false;
function ui(){const on=!au.paused;$("#pp").textContent=on?"❚❚":"▶";$("#pp").setAttribute("aria-label",on?"Pause chanting":"Play chanting");$("#pp").title=bad?"Chant audio file not found":on?"Pause chanting":"Play chanting"}
async function tog(){try{bad=false;au.paused?await au.play():au.pause()}catch(e){bad=true}ui()}
au.onplay=au.onpause=ui;au.onerror=()=>{if(++si<SR.length){au.src=SR[si];return}bad=true;ui()};
$("#pp").onclick=tog;
if("mediaSession" in navigator){try{navigator.mediaSession.metadata=new MediaMetadata({title:"Swamiye Saranam Ayyappa",artist:"Mala Deeksha"});navigator.mediaSession.setActionHandler("play",()=>au.play());navigator.mediaSession.setActionHandler("pause",()=>au.pause())}catch(e){}}
const DBU="https://maala-dee8b-default-rtdb.asia-southeast1.firebasedatabase.app";const DBC="ayyappa41k7q2x9mw";const SY={u:DBU,c:DBC};
const syOn=()=>SY.u&&SY.c,syUrl=()=>SY.u.replace(/\/+$/,"")+"/mala/"+encodeURIComponent(SY.c)+".json";
function merge(r){if(!r||typeof r!=="object")return false;let ch=false;
 if(r.days)for(const d in r.days){const a=r.days[d],b=S.days[d];if(!a)continue;
  if(!b||(a.t||0)>(b.t||0)||(!b.t&&!(b.c&&b.c.length)&&!(b.n||"").trim())){S.days[d]={c:a.c||[],n:a.n||"",t:a.t||0};ch=true}}
 if((r.vt||0)>(S.vt||0)&&r.vows){S.vows=r.vows;S.start=r.start||S.start;S.vt=r.vt;ch=true}
 if(ch){try{localStorage.setItem("mala41",JSON.stringify(S))}catch(e){}}return ch}

 try{const r=await fetch(syUrl());if(!r.ok)return;const ch=merge(await r.json());if(ch)all();push()}
 catch(e){}}

 catch(e){}},800)}

async function sha(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function applyLock(){document.body.classList.toggle("lk",!UNL);
 ["all","clr","av","nv"].forEach(i=>{$("#"+i).disabled=!UNL});$("#note").readOnly=!UNL;
